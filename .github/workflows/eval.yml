name: CI & Agent Evaluation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  agent-evaluation:
    name: Run Unit Tests & Benchmark Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Sandbox Docker Image
        run: |
          docker build -t python-pytest-sandbox:latest -f Dockerfile.sandbox .

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Integration Suite
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: mistral
          MISTRAL_MODEL: codestral-latest
        run: |
          python -m pytest tests/ -v -s

      - name: Execute Automated Evaluation Benchmark Harness
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: mistral
          MISTRAL_MODEL: codestral-latest
          EVAL_CONCURRENCY: "1"  # Enforces single-concurrency to strictly stay within API rate limits
        run: |
          python -m evals.eval_runner

      - name: Upload Benchmark Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-latest-run
          path: evals/results/latest_run.json
          if-no-files-found: ignore